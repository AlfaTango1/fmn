name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEY_PASS: a74f03da9688ea10c2566cb1

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Get files
        uses: actions/checkout@v5

      - name: Check app files
        run: |
          # If the zip itself was uploaded - unpack it
          if [ ! -f package.json ]; then
            Z=$(find . -name "*.zip" -not -path "./.git/*" | head -n1)
            if [ -n "$Z" ]; then echo "Unpacking $Z"; unzip -o -q "$Z" -d . ; fi
          fi
          # If files were uploaded inside a subfolder - move them to the root
          if [ ! -f package.json ]; then
            P=$(find . -name package.json -not -path "./.git/*" -not -path "*/node_modules/*" | head -n1)
            if [ -n "$P" ]; then D=$(dirname "$P"); echo "Files found in $D"; cp -rn "$D"/. . ; fi
          fi
          echo "Files in repository:"; ls -la
          MISSING=""
          for f in index.html package.json capacitor.config.json icon.png release.keystore; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Not uploaded to repository:$MISSING -> Add file > Upload files, then Actions > Build APK > Run workflow"
            exit 1
          fi
          echo "All files OK"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (already on GitHub server)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "SDK: $SDK"; ls "$SDK/platforms" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Capacitor and the map library
        run: npm install

      - name: Prepare app files
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/
          cp -r node_modules/leaflet/dist/images www/lib/

      - name: Create Android project
        run: npx cap add android

      - name: GPS permission and screen always on
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest># <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          MA=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          PKG=$(sed -n 's/^package \(.*\);/\1/p' "$MA")
          printf '%s\n' "package $PKG;" "" "import android.os.Bundle;" "import android.view.WindowManager;" "import com.getcapacitor.BridgeActivity;" "" \
            "public class MainActivity extends BridgeActivity {" \
            " @Override" \
            " public void onCreate(Bundle savedInstanceState) {" \
            " super.onCreate(savedInstanceState);" \
            " getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);" \
            " }" "}" > "$MA"

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets && cp icon.png assets/icon.png
          npx --yes @capacitor/assets@3.0.5 generate --android --assetPath assets

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=$KEY_PASS \
            -Pandroid.injected.signing.key.alias=fmn \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      - name: Name the APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" FlightMissionNavigator.apk
          ls -la FlightMissionNavigator.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flight Mission Navigator — build ${{ github.run_number }}
          files: FlightMissionNavigator.apk

      - name: Also keep APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: FlightMissionNavigator-apk
          path: FlightMissionNavigator.apk
